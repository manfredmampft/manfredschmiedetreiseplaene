<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Türchen 7 – Adventskalender</title>
  <style>
    body {
      background: linear-gradient(180deg, #06281f, #14532d);
      color: white;
      font-family: system-ui, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      background: white;
      color: #101020;
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 { margin-top: 0; }
    input, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .answer-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
    }
    p#feedback {
      margin-top: 10px;
      color: #ff6b6b;
      min-height: 18px;
    }
    a.back-link {
      display: block;
      margin-top: 20px;
      color: #ff6b6b;
      font-weight: 600;
      text-decoration: none;
    }
    a.back-link:hover {
      text-decoration: underline;
    }
    /* Gedicht: linksbündig mit Abstand zwischen Strophen */
    .card p.poem-stanza {
      text-align: left;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    /* Frage absetzen und zentrieren */
    .card p.question {
      margin-top: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Türchen 7</h1>
    <p>Heute bin ich zu Besuch in DER klassischen Wasserballnation.</p>
   
    <p class="question">In welchem Land bin ich heute?</p>

    <div class="answer-row">
      <input id="answer" placeholder="Antwort eingeben" aria-label="Antwort eingeben" />
      <button onclick="check()">Absenden</button>
    </div>

    <p id="feedback" role="alert" aria-live="assertive"></p>

    <a href="index.html" class="back-link">← Zurück zum Adventskalender</a>
  </div>

  <script>
    function check() {
      const val = document.getElementById('answer').value.toLowerCase().trim();
      const allowed = ["ungarn", "hungary"];
      if (allowed.includes(val)) {
        window.location.href = "success_day7_81f34b6c.html"; // Erfolgsseite
      } else {
        document.getElementById('feedback').textContent = "Fast! Versuch es nochmal 😊";
      }
    }
  </script>
</body>
</html>
