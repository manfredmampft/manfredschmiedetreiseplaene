<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Türchen 1 – Adventskalender</title>
  <style>
    html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #06281f, #14532d);
    color: white;
    font-family: system-ui, Arial, sans-serif;
    padding: 24px;
    overflow-y: auto;
  }

  .card {
    background: white;
    color: #101020;
    border-radius: 12px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    text-align: center;
    box-sizing: border-box;
  }

  .card ul,
  .card ol {
    text-align: left;
    margin: 0 auto;
    display: inline-block;
  }

  h1 { margin-top: 0; }

  input, button {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .answer-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    justify-content: center;
  }

  p#feedback {
    margin-top: 10px;
    color: #ff6b6b;
    min-height: 18px;
  }

  a.back-link {
    display: block;
    margin-top: 20px;
    color: #ff6b6b;
    font-weight: 600;
    text-decoration: none;
  }

  a.back-link:hover {
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    body {
      align-items: flex-start;
      padding: 6px;
    }
    .card {
      padding: 14px;
      max-width: 100%;
      border-radius: 0;
      font-size: 1rem;
    }
  }
  </style>
</head>
<body>
  <div class="card">
    <h1>Türchen 1</h1>
    <p>Dieses Land ist heute relativ klein – im 15. Jahrhundert war es jedoch das größte Land Europas.</p>
    <p>In welchem Land bin ich heute?</p>
    <div class="answer-row">
      <input id="answer" placeholder="Antwort eingeben" aria-label="Antwort eingeben">
      <button onclick="check()">Absenden</button>
    </div>

    <p id="feedback" role="alert" aria-live="assertive"></p>

    <a href="index.html" class="back-link">← Zurück zum Adventskalender</a>
  </div>

  <script>
    function check() {
      const val = document.getElementById('answer').value.toLowerCase().trim();
      const allowed = ["litauen", "lithuania"];
      if (allowed.includes(val)) {
        // Erfolgsseite oder Text anzeigen – hier Beispiel Weiterleitung
        window.location.href = "success_day1_7c3e5d89.html"; // Passe die Erfolgsseite an!
      } else {
        document.getElementById('feedback').textContent = "Fast! Versuch es nochmal 😊";
      }
    }
  </script>
</body>
</html>
